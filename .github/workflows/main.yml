name: Generator

on:
  schedule:
    - cron: "0 21 * * *"
  workflow_dispatch:
  push:
    branches:
      - develop

permissions:
  contents: write
  pull-requests: write

jobs:
  generator:
    runs-on: ubuntu-latest
    steps:
      # code comes from the default branch, documents from develop
      - uses: actions/checkout@v7
      - name: Checkout develop documents
        run: |
          git fetch --depth=1 origin develop
          git checkout origin/develop -- docs
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - uses: fa0311/twitter-secrets@main
        with:
          age-key: ${{ secrets.SOPS_AGE_KEY }}
      - name: Run Python
        run: uv run python generator.py
        env:
          ENV: "GithubAction"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          BASE_BRANCH: "master"
          REF_BRANCH: "develop"
      - name: Run Python (Deck)
        run: uv run python generator.py
        env:
          ENV: "GithubAction"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          BASE_BRANCH: "master"
          REF_BRANCH: "develop"
          CLIENT_TYPE: Deck
          OUTPUT_DIR: docs/deck
