name: Generator (legacy-twitter)

on:
  workflow_dispatch:
  push:
    branches:
      - develop

permissions:
  contents: write
  pull-requests: write

jobs:
  legacy-twitter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Checkout legacy-twitter documents
        run: |
          git fetch --depth=1 origin legacy-twitter
          git checkout origin/legacy-twitter -- docs
          git fetch origin c150806085e7d482a366da38c4d036b5ac12f28e
          git checkout c150806085e7d482a366da38c4d036b5ac12f28e -- docs/json/ScriptLoadJson.json
      - uses: astral-sh/setup-uv@v10.3.1
        with:
          enable-cache: true
      - uses: fa0311/twitter-secrets@main
        with:
          age-key: ${{ secrets.SOPS_AGE_KEY }}
      - name: Run Python
        run: uv run python generator.py
        env:
          ENV: "GithubAction"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          REF_BRANCH: "legacy-twitter"
          READ_SCRIPT_JSON: "True"
